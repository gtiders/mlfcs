site_name: MLFCS 文档
site_description: 从二阶到任意阶的 ASE 优先对称约化力常数库
site_url: https://gtiders.github.io/mlfcs/zh/
docs_dir: docs/zh
site_dir: site/zh
repo_url: https://github.com/gtiders/mlfcs
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: blue
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            separate_signature: true
            members_order: source
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed
  - tables
nav:
  - 首页: index.md
  - 入门:
      - 总览: getting-started/index.md
      - 安装: getting-started/installation.md
      - 第一个 FC2: getting-started/first-fc2.md
      - 结构与后处理软件: getting-started/structures.md
  - 工作流:
      - 总览: workflows/index.md
      - 有限差分: workflows/finite-difference.md
      - 外部计算器: workflows/external-calculators.md
      - 仅力数据拟合: workflows/fitting.md
      - SSCHA: workflows/sscha.md
      - SCPH: workflows/scph.md
      - 外推: workflows/extrapolation.md
  - 方法:
      - 架构: methods/architecture.md
      - 周期几何与 IFC: methods/periodic-ifc.md
      - 求和规则: methods/sum-rules.md
      - Wick 与 Taylor 基: methods/wick-taylor.md
  - 格式:
      - 总览与不变量: formats/index.md
      - 原生 HDF5: formats/hdf5.md
      - Phonopy 与 phono3py: formats/phonopy.md
      - ShengBTE: formats/shengbte.md
      - ALAMODE XML: formats/alamode.md
  - 案例: cases/index.md
  - 参考:
      - API 总览: reference/api.md
      - 单位与参数: reference/parameters.md
      - 诊断: reference/diagnostics.md
  - 开发:
      - 测试与案例: development/tests-and-examples.md
      - 数值验证: development/validation.md
      - 贡献: development/contributing.md
