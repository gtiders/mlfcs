name: Deploy documentation

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: uv sync --locked --group docs

      - name: Build English documentation
        run: uv run --group docs mkdocs build --strict -f mkdocs.yml

      - name: Build Chinese documentation
        run: uv run --group docs mkdocs build --strict -f mkdocs.zh.yml

      - name: Place English site at Pages root
        run: |
          cp -a site/en/. site/
          test -f site/index.html
          test -f site/zh/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
