site_name: MLFCS 文档
site_description: ASE-first symmetry-reduced force constants from second to arbitrary order
site_url: https://gtiders.github.io/mlfcs/
site_dir: site
repo_url: https://github.com/gtiders/mlfcs
repo_name: gtiders/mlfcs
edit_uri: edit/dev/docs/
copyright: MLFCS contributors

# The documentation tooling lives inside docs_dir, so everything that belongs to the site
# sits in one tree; it must not be published as static files. Notebook training data is
# needed to re-execute the tutorials but is not site content.
exclude_docs: |
  /overrides/
  /scripts/
  /notebooks/data/
  /archive/

hooks:
  - docs/scripts/notebook_links.py

nav:
  - 总览: index.md
  - API:
      - 核心概念: core-concepts.md
      - 有限差分: finite-difference-api.md
      - 拟合: fitting-api.md
      - 长程力与 Ewald: ewald-api.md
      - 谐波声子: harmonic-api.md
      - SCPH: scph.md
      - Q&A: Q&A.md
  - 教程:
      - 教程总览: notebooks/index.md
      - NaCl：长程力扣除与 FC2 拟合: notebooks/nacl-long-range.ipynb
      - 石墨烯与 MoS₂：转动求和规则: notebooks/rotational-sum-rules.ipynb
      - Si：有限差分与外推: notebooks/si-finite-difference.ipynb
      - Ba8Ga16Ge30：FC2+FC3 拟合与声子谱: notebooks/ba8ga16ge30.ipynb
      - Si：FC2–FC5 联合拟合与热导率: notebooks/si-fitting.ipynb
      - K4As4Pt2：FC2–FC4 拟合、热导率与 SCPH: notebooks/k4as4pt2.ipynb
  - 开发者参考:
      - 数值契约与对象生命周期: development/numerical-contracts.md
      - 长程动力学待实现设计: development/long-range-dynamics.md
  - 理论与概念:
      - 阅读路线: theory/index.md
      - 周期晶体中的高阶力常数: theory/periodic-force-constants.md
      - 对称性与独立参数: theory/symmetry-parameterization.md
      - 平移与旋转不变性: theory/invariance-constraints.md
      - 超胞、折叠与可辨识性: theory/supercells-identifiability.md
      - 从原子力恢复力常数: theory/reconstruction.md
      - 谐波晶格动力学: theory/harmonic-dynamics.md
      - 有限 q 网格与倒空间对称性: theory/reciprocal-symmetry.md
      - 长程 dipole 作用: theory/long-range-electrostatics.md
      - 进阶:
          - 精确线性代数认证: theory/advanced/exact-linear-algebra.md
          - 自洽声子: theory/advanced/self-consistent-phonons.md
      - 查阅:
          - 符号与坐标约定: theory/notation.md
          - 术语索引: theory/glossary.md
          - 范围与限制: theory/limitations.md

theme:
  name: material
  custom_dir: docs/overrides
  language: zh
  logo: assets/images/logo.png
  favicon: assets/images/logo.png
  features:
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  palette:
    # The paper colour of the light scheme and its dark counterpart are tinted in
    # docs/assets/stylesheets/extra.css; these entries only pick the scheme bases.
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

plugins:
  - search
  - mkdocs-jupyter:
      # Tutorials ship with their committed execution outputs; the build only
      # renders them. Re-execution is a manual serial step, one notebook at a
      # time, via the tutorial dependency group.
      execute: false
      include_source: true
      kernel_name: python3

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - tables

extra_javascript:
  # Must precede the MathJax bundle: notebook pages keep literal $...$, and
  # MathJax 3 only honours those delimiters when configured before startup.
  - assets/javascripts/mathjax-config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/stylesheets/extra.css
