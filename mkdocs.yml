site_name: MLFCS Documentation
site_description: ASE-first symmetry-reduced force constants from second to arbitrary order
site_url: https://gtiders.github.io/mlfcs/
site_dir: site/en
exclude_docs: |
  zh/**
repo_url: https://github.com/gtiders/mlfcs
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: blue
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            separate_signature: true
            members_order: source
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed
  - tables
nav:
  - Home: en/index.md
  - Getting started:
      - Overview: en/getting-started/index.md
      - Installation: en/getting-started/installation.md
      - First FC2: en/getting-started/first-fc2.md
      - Structure and downstream software: en/getting-started/structures.md
  - Workflows:
      - Overview: en/workflows/index.md
      - Finite differences: en/workflows/finite-difference.md
      - External calculators: en/workflows/external-calculators.md
      - Force-only fitting: en/workflows/fitting.md
      - SSCHA: en/workflows/sscha.md
      - SCPH: en/workflows/scph.md
      - Extrapolation: en/workflows/extrapolation.md
  - Methods:
      - Architecture: en/methods/architecture.md
      - Periodic geometry and IFCs: en/methods/periodic-ifc.md
      - Sum rules: en/methods/sum-rules.md
      - Wick and Taylor bases: en/methods/wick-taylor.md
  - Formats:
      - Overview and invariants: en/formats/index.md
      - Native HDF5: en/formats/hdf5.md
      - Phonopy and phono3py: en/formats/phonopy.md
      - ShengBTE: en/formats/shengbte.md
      - ALAMODE XML: en/formats/alamode.md
  - Cases: en/cases/index.md
  - Reference:
      - API overview: en/reference/api.md
      - Units and parameters: en/reference/parameters.md
      - Diagnostics: en/reference/diagnostics.md
  - Development:
      - Tests and examples: en/development/tests-and-examples.md
      - Validation: en/development/validation.md
      - Contributing: en/development/contributing.md
