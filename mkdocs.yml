site_name: MLFCS Documentation
site_description: ASE-first symmetry-reduced force constants from second to arbitrary order
site_url: https://gtiders.github.io/mlfcs/
site_dir: site
repo_url: https://github.com/gtiders/mlfcs
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: blue
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            separate_signature: true
            members_order: source
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed
  - tables
nav:
  - Home: index.md
  - Getting started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - First FC2: getting-started/first-fc2.md
      - Structure and downstream software: getting-started/structures.md
  - Workflows:
      - Overview: workflows/index.md
      - Finite differences: workflows/finite-difference.md
      - External calculators: workflows/external-calculators.md
      - Force-only fitting: workflows/fitting.md
      - SSCHA: workflows/sscha.md
      - SCPH: workflows/scph.md
      - Extrapolation: workflows/extrapolation.md
  - Methods:
      - Architecture: methods/architecture.md
      - Periodic geometry and IFCs: methods/periodic-ifc.md
      - Sum rules: methods/sum-rules.md
      - Wick and Taylor bases: methods/wick-taylor.md
  - Formats:
      - Overview and invariants: formats/index.md
      - Native HDF5: formats/hdf5.md
      - Phonopy and phono3py: formats/phonopy.md
      - ShengBTE: formats/shengbte.md
      - ALAMODE XML: formats/alamode.md
  - Cases: cases/index.md
  - Reference:
      - API overview: reference/api.md
      - Units and parameters: reference/parameters.md
      - Diagnostics: reference/diagnostics.md
  - Development:
      - Tests and examples: development/tests-and-examples.md
      - Validation: development/validation.md
      - Contributing: development/contributing.md
  - 中文文档:
      - 首页: zh/index.md
      - 入门:
          - 总览: zh/getting-started/index.md
          - 安装: zh/getting-started/installation.md
          - 第一个 FC2: zh/getting-started/first-fc2.md
          - 结构与后处理软件: zh/getting-started/structures.md
      - 工作流:
          - 总览: zh/workflows/index.md
          - 有限差分: zh/workflows/finite-difference.md
          - 外部计算器: zh/workflows/external-calculators.md
          - 仅力数据拟合: zh/workflows/fitting.md
          - SSCHA: zh/workflows/sscha.md
          - SCPH: zh/workflows/scph.md
          - 外推: zh/workflows/extrapolation.md
      - 方法:
          - 架构: zh/methods/architecture.md
          - 周期几何与 IFC: zh/methods/periodic-ifc.md
          - 求和规则: zh/methods/sum-rules.md
          - Wick 与 Taylor 基: zh/methods/wick-taylor.md
          - Direct-Gram: zh/methods/direct-gram.md
          - SNF 映射: zh/methods/snf-mapping.md
      - 格式:
          - 总览与不变量: zh/formats/index.md
          - 原生 HDF5: zh/formats/hdf5.md
          - Phonopy 与 phono3py: zh/formats/phonopy.md
          - ShengBTE: zh/formats/shengbte.md
          - ALAMODE XML: zh/formats/alamode.md
      - 案例: zh/cases/index.md
      - 参考:
          - API 总览: zh/reference/api.md
          - 单位与参数: zh/reference/parameters.md
          - 诊断: zh/reference/diagnostics.md
      - 开发:
          - 测试与案例: zh/development/tests-and-examples.md
          - 数值验证: zh/development/validation.md
          - 贡献: zh/development/contributing.md
