site_name: MLFCS Documentation
site_description: ASE-first symmetry-reduced force constants from second to arbitrary order
site_url: https://gtiders.github.io/mlfcs/
site_dir: site
repo_url: https://github.com/gtiders/mlfcs
repo_name: gtiders/mlfcs
edit_uri: edit/dev/docs/
copyright: MLFCS contributors

nav:
  - Home: index.md
  - Finite difference: finite-difference-api.md
  - Fitting: fitting-api.md
  - Q&A: Q&A.md

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/logo.png
  favicon: assets/images/logo.png
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: teal
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
        - locale: zh
          name: 简体中文
          nav_translations:
            Home: 概览
            Finite difference: 有限差分
            Fitting: 拟合

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed
  - tables

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/stylesheets/extra.css
