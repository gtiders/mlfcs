[project]
name = "mlfcs-new"
version = "0.5.0"
description = "ASE-first symmetry-reduced force constants from second to arbitrary order"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "ase>=3.29.0",
    "h5py>=3.14",
    "jax>=0.11.0",
    "numpy>=1.26.0,<2.5",
    "pypolymlp>=0.20.4",
    "scipy>=1.16",
    "spglib>=2.6",
]

[project.optional-dependencies]
sscha = [
    "phonopy>=2.43",
    "symfc>=1.5",
]

[dependency-groups]
dev = [
    "hiphive>=1.5",
    "phono3py>=3.18",
    "pytest>=8.4",
    "ruff>=0.12",
]

[[tool.uv.index]]
url = "https://mirrors.ustc.edu.cn/pypi/web/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlfcs"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: public API integration tests",
    "reference: independent external scientific reference tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
