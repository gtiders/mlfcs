[project]
name = "mlfcs"
version = "4.0.0a2"
description = "ASE-first symmetry-reduced force constants from second to arbitrary order"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "third_party_licenses/ALM-MIT.txt"]
authors = [{ name = "Yibo Gao", email = "242211044@csu.edu.cn" }]
keywords = [
    "anharmonicity",
    "force-constants",
    "jax",
    "materials-science",
    "phonons",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "ase>=3.29.0",
    "h5py>=3.14",
    "jax>=0.11.0",
    "numpy>=1.26.0,<2.5",
    "scipy>=1.16",
    "spglib>=2.6",
]

[project.urls]
Documentation = "https://github.com/gtiders/mlfcs#readme"
Issues = "https://github.com/gtiders/mlfcs/issues"
Repository = "https://github.com/gtiders/mlfcs"

[dependency-groups]
dev = [
    "hiphive>=1.5",
    "phono3py>=3.18",
    "pytest>=8.4",
    "ruff>=0.12",
]
reference = [
    "pypolymlp>=0.20.4",
]

[[tool.uv.index]]
url = "https://mirrors.ustc.edu.cn/pypi/web/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlfcs"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: public API integration tests",
    "reference: independent external scientific reference tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
known-third-party = ["phonopy"]
