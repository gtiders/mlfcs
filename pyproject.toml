[project]
name = "mlfcs"
version = "5.0.0"
description = "ASE-first symmetry-reduced force constants from second to arbitrary order"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Yibo Gao", email = "242211044@csu.edu.cn" }]
keywords = [
    "anharmonicity",
    "force-constants",
    "materials-science",
    "numba",
    "phonons",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "ase>=3.23",
    "h5py>=3.10",
    "numba>=0.67.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "spglib>=2.5",
]

[project.urls]
Documentation = "https://gtiders.github.io/mlfcs/"
Issues = "https://github.com/gtiders/mlfcs/issues"
Repository = "https://github.com/gtiders/mlfcs"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]
# Independent exact-algebra reference dependency; tutorial integrations are separate.
reference = [
    "sympy>=1.13",
]
# Dependencies for executing the documentation tutorial notebooks; run them
# serially, one notebook at a time.
tutorial = [
    "phonopy>=2.20",
    "phono3py>=3.0",
    "matplotlib",
    "seekpath",
    "nbclient",
    "ipykernel",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-jupyter>=0.25",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlfcs"]

[tool.hatch.build.targets.sdist]
# A local checkout used for external comparisons is not part of this package.
exclude = ["/alamode"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "reference: numerical comparisons requiring optional scientific reference packages",
]

[tool.ruff]
line-length = 100
target-version = "py312"
