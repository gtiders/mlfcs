[project]
name = "mlfcs"
version = "4.5.1"
description = "ASE-first symmetry-reduced force constants from second to arbitrary order"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Yibo Gao", email = "242211044@csu.edu.cn" }]
keywords = [
    "anharmonicity",
    "force-constants",
    "materials-science",
    "numba",
    "phonons",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "ase>=3.23",
    "h5py>=3.10",
    "numba>=0.67.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "spglib>=2.5",
    "sympy>=1.13",
]

[project.urls]
Documentation = "https://gtiders.github.io/mlfcs/en/"
Issues = "https://github.com/gtiders/mlfcs/issues"
Repository = "https://github.com/gtiders/mlfcs"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]
# Oracles for the cross-checks against phonopy/phono3py. They are heavy C-extension
# packages and no production code imports them, so they live in their own group: the
# default environment skips those tests, and this group runs the whole suite.
reference = [
    "phonopy>=2.20",
    "phono3py>=3.0",
]
docs = [
    "mkdocs-material>=9.5",
]

[[tool.uv.index]]
url = "https://mirrors.ustc.edu.cn/pypi/web/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlfcs"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
