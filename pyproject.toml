[project]
name = "mlfcs-new"
version = "3.0.0"
description = "ASE-first symmetry-reduced force constants from second to arbitrary order"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "gtiders", email = "gtiders@qq.com" },
]
keywords = [
    "anharmonicity",
    "force-constants",
    "jax",
    "materials-science",
    "phonons",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "ase>=3.29.0",
    "h5py>=3.14",
    "jax>=0.11.0",
    "numpy>=1.26.0,<2.5",
    "scipy>=1.16",
    "spglib>=2.6",
]

[project.urls]
Documentation = "https://github.com/gtiders/mlfcs#readme"
Issues = "https://github.com/gtiders/mlfcs/issues"
Repository = "https://github.com/gtiders/mlfcs"

[project.optional-dependencies]
sscha = [
    "phonopy>=2.43",
    "symfc>=1.5",
]

[dependency-groups]
dev = [
    "hiphive>=1.5",
    "phono3py>=3.18",
    "pytest>=8.4",
    "ruff>=0.12",
]
reference = [
    "pypolymlp>=0.20.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlfcs"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: public API integration tests",
    "reference: independent external scientific reference tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
known-third-party = ["phonopy"]
